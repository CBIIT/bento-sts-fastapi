[project]
name = "bento-sts"
version = "2.5.0-rc"
description = "FastAPI implementation of Simple Terminology Service"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License"
]
dependencies = [
    "cryptography>=46.0.5",
    "fastapi[standard]>=0.118.0",
    "neo4j>=6.0.2",
    "pydotenv>=0.0.7",
    "pytest>=8.4.2",
    "pytest-docker>=3.2.3",
    "requests>=2.32.5",
    "semver>=3.0.4",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "black>=25.9.0",
    "flake8>=7.3.0",
    "jedi>=0.19.2",
    "openapi-python-client>=0.26.1",
    "pytest-docker>=3.2.3",
    "rope>=1.14.0",
    "yapf>=0.43.0",
]

[tool.pytest.ini_options]
addopts = "-s -k local"
